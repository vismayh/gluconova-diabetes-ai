<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlucoNova | Diabetes Risk Intelligence</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f8fc;
}

.hero{
height:100vh;
background:linear-gradient(135deg,#00B4DB,#0083B0);
color:white;
padding:50px;
display:flex;
justify-content:center;
align-items:center;
}

.container{
display:flex;
width:90%;
justify-content:space-between;
align-items:center;
}

.left{
width:45%;
}

.left h1{
font-size:50px;
margin-bottom:20px;
}

.left p{
font-size:18px;
line-height:30px;
margin-bottom:30px;
}

.form-box{

background:white;
padding:30px;
width:420px;
border-radius:20px;
box-shadow:0px 5px 25px rgba(0,0,0,.2);

}

.form-box h2{

color:#0083B0;
margin-bottom:20px;
text-align:center;
}

input{

width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;

}

button{

width:100%;
padding:14px;
background:#0083B0;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#005f7a;

}

.result{

margin-top:20px;
text-align:center;
font-size:20px;
font-weight:bold;
color:#0083B0;

}

.cards{

display:flex;
justify-content:center;
gap:20px;
padding:50px;
}

.card{

background:white;
padding:30px;
width:250px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
text-align:center;

}

</style>

</head>

<body>

<section class="hero">

<div class="container">

<div class="left">

<h1>See your diabetes risk clearly</h1>

<p>

Modern AI-powered diabetes risk intelligence platform for quick
health screening and prediction.

</p>

</div>

<div class="form-box">

<h2>Health Check</h2>

<form action="/predict" method="POST">

<input type="number" name="pregnancies" placeholder="Pregnancies" required>

<input type="number" name="glucose" placeholder="Glucose" required>

<input type="number" name="bloodpressure" placeholder="Blood Pressure" required>

<input type="number" name="skinthickness" placeholder="Skin Thickness" required>

<input type="number" name="insulin" placeholder="Insulin" required>

<input type="number" step="0.1" name="bmi" placeholder="BMI" required>

<input type="number" step="0.01" name="dpf" placeholder="Diabetes Pedigree Function" required>

<input type="number" name="age" placeholder="Age" required>

<button type="submit">
Predict Risk
</button>

</form>

<div class="result">

{{ prediction_text }}

</div>

</div>

</div>

</section>

<section class="cards">

<div class="card">
<h2>74%</h2>
<p>Model Accuracy</p>
</div>

<div class="card">
<h2>AI</h2>
<p>ML Prediction Engine</p>
</div>

<div class="card">
<h2>24/7</h2>
<p>Health Monitoring</p>
</div>

</section>

</body>
</html>
